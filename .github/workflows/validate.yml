name: APIS static validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript and free-data wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(script => script.trim());
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((script, index) => {
            try { new Function(script); }
            catch (error) { throw new Error('Inline script ' + (index + 1) + ': ' + error.message); }
          });
          const checks = {
            version: html.includes('build-version" content="2.5.0"'),
            freeMode: html.includes('Stooq public CSV snapshots') && html.includes('Yahoo Finance public chart fallback'),
            stooqAdapter: html.includes('async function fetchStooqQuote'),
            yahooFallback: html.includes('async function fetchYahooQuote'),
            publicWaterfall: html.includes('async function fetchMarketQuote'),
            bitcoin: html.includes('function connectBitcoinStream'),
            fx: html.includes('function loadFxReference'),
            treasury: html.includes('function loadTreasuryCurve'),
            macro: html.includes('async function loadMacroCalendar'),
            news: html.includes('const feeds=['),
            homeStocks: html.includes('class="ios-stock-list" id="featuredQuotes"'),
            homeSearch: html.includes('id="homeSearchToggle"') && html.includes('id="homeSearch"'),
            homeBitcoin: html.includes('id="btcPrice"'),
            homeUsdIdr: html.includes('id="fxValue"'),
            marketSegments: html.includes('id="marketFilters"') && html.includes('data-market-filter="commodities"'),
            commodities: ["XAUUSD=X","CL=F","BZ=F","HG=F"].every(symbol => html.includes("symbol:'" + symbol + "'")),
            sparkline: html.includes('sparkline:closes.filter'),
            noBrokenChartEmbed: !html.includes('function loadChart()') && !html.includes('function loadWidgets()') && !html.includes('function mountWidget(') && !html.includes('id="mainChart"'),
            animatedControls: html.includes('.news-alert-control input[type=checkbox]:checked:before') && html.includes('@keyframes ios-page-in'),
            sourceHealthRowsValid: html.includes("['Price mini-charts','Sparkline is shown only when a provider returns historical price observations. Snapshot-only rows do not get a fabricated chart.','PROVIDER HISTORY','good'],") && html.includes("['Binance WebSocket'"),
            noWideTable: !html.includes('id="watchlistPanel"') && !html.includes('id="watchlistBody"'),
            noTwelveData: !html.includes('fetchTwelveDataQuote') && !html.includes('twelveDataKey'),
            noFmp: !html.includes('fetchFmpQuote') && !html.includes('fmpKey'),
            noPaidSettings: !html.includes('initProviderSettings') && !html.includes('marketProviderKeys')
          };
          const failed = Object.entries(checks).filter(([, value]) => !value);
          console.log('Inline scripts compiled:', scripts.length);
          console.log(checks);
          if (failed.length) throw new Error('Failed checks: ' + failed.map(([key]) => key).join(', '));
          console.log('APIS static validation passed.');
          NODE
