name: Deploy APIS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate APIS HTML, IDs and JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].filter(m => m[1].trim());
          if (scripts.length !== 1) throw new Error('Expected exactly one inline application script; found ' + scripts.length);
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate HTML ids: ' + [...new Set(duplicates)].join(', '));
          const idSet = new Set(ids);
          if (!idSet.has('refreshBtn')) throw new Error('Critical refreshBtn is missing; startup would fail.');
          const js = scripts[0][1];
          const refs = [...js.matchAll(/getElementById\(['"]([^'"]+)['"]\)/g)].map(m => m[1]);
          const missing = [...new Set(refs.filter(id => !idSet.has(id)))];
          if (missing.length) throw new Error('JavaScript references missing DOM IDs: ' + missing.join(', '));
          for (const fn of ['fetchQuoteBatch','fetchBitcoinRest','connectBitcoinStream','loadFxReference','loadTreasuryCurve','loadPublicNews','loadEdgarFilings','renderMovers']) {
            if (!js.includes('function ' + fn + '(') && !js.includes('async function ' + fn + '(')) throw new Error('Required function missing: ' + fn);
          }
          fs.writeFileSync('/tmp/apis-inline.js', js);
          console.log('APIS structure checks passed; ids:', ids.length, 'JS bytes:', js.length);
          NODE
          node --check /tmp/apis-inline.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
