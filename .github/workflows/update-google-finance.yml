name: Refresh Google Finance index snapshots

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-google-finance.mjs'
      - '.github/workflows/update-google-finance.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: google-finance-snapshot
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and validate Google Finance public index pages
        run: node scripts/update-google-finance.mjs
      - name: Commit timestamped Google Finance snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-finance-quotes.json
          if git diff --cached --quiet; then
            echo "Google Finance snapshot unchanged; no commit required."
          else
            git commit -m "Refresh Google Finance index snapshots"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
