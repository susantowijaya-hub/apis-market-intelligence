name: APIS static validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript and free-data wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(script => script.trim());
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((script, index) => {
            try { new Function(script); }
            catch (error) { throw new Error('Inline script ' + (index + 1) + ': ' + error.message); }
          });
          const checks = {
            version: html.includes('build-version" content="2.10.1"'),
            dailyIndexCloseOnly: html.includes("const hasDailyBars=isDailyIndex&&plan.interval==='1d'") && html.includes('useDailyClose=hasDailyBars&&barPrice!==null') && html.includes('const dailyBars=hasDailyBars?closes.map'),
            dailyIndexCloseBaseline: html.includes('const baselineCutoff=useDailyClose?selectedDailyBarDay:sessionDay') && html.includes('selectDailyIndexPreviousClose(dailyBars,baselineCutoff,session.zone)'),
            finalCloseTimeGuard: html.includes('Provider observation predates the official close window') && html.includes('session.finalCloseMinute-10'),
            stooqSessionDateGuard: html.includes('Stooq observation date does not match the current exchange session'),
            usClosingAuction: html.includes("openWindows=[[9*60+30,15*60+50]];auctionWindow=[15*60+50,16*60]"),
            hongKongLunchBreak: html.includes('openWindows=[[9*60+30,12*60],[13*60,16*60]]'),
            closedRefreshGuardRestore: html.includes("closedRefreshDone:loadJSON('apis_market_closed_refresh_done',{})"),
            freeMode: html.includes('Stooq public CSV snapshots') && html.includes('Yahoo Finance public chart fallback'),
            stooqAdapter: html.includes('async function fetchStooqQuote'),
            googleFinanceAdapter: html.includes('async function fetchGoogleFinanceQuote') && html.includes('function parseGoogleFinanceQuotePage'),
            googleFinanceIndexCoverage: ['COMPOSITE:IDX','IX0001:TPE','000001:SHA','KOSPI:KRX','NI225:INDEXNIKKEI','HSI:INDEXHANGSENG','.INX:INDEXSP','.IXIC:INDEXNASDAQ','.DJI:INDEXDJX'].every(symbol => html.includes("googleFinanceSymbol:'"+symbol+"'")),
            googleFinanceComparison: html.includes('async function fetchIndexProviderComparison') && html.includes('providerComparison'),
            googleFinanceTimestampGuard: html.includes('Google Finance source timestamp is missing') && html.includes('Google Finance source timestamp is invalid or stale'),
            yahooFallback: html.includes('async function fetchYahooQuote'),
            publicWaterfall: html.includes('async function fetchMarketQuote'),
            xauSpotAdapter: html.includes('async function fetchXauSpotQuote') && html.includes('https://xaus.com/api/v1/spot?compact=1'),
            xauIntradayValidation: html.includes('coverage_seconds') && html.includes('historyCoverage>=23*3600'),
            twseOfficialRwd: html.includes('/rwd/zh/afterTrading/MI_INDEX?date=') && html.includes('function parseTwseIndexReport'),
            twseGregorianDate: html.includes('if(raw.length===8)'),
            twsePreviousCloseValidation: html.includes('const signedText=value=>') && html.includes('previousClose=price/(1+changePct/100)'),
            taiwanPercentSourceGuard: html.includes('async function fetchTaiwanOfficialQuote') && html.includes("if(item.symbol==='^TWII')") && html.includes('return fetchYahooQuote(item)'),
            yahooTaiwanPercentSuppression: html.includes("quote.symbol==='^TWII'&&!String(quote.source||'').toUpperCase().includes('TWSE')"),
            regionalGroups: html.includes('function renderGroupedStockRows') && html.includes("region:'Greater China'"),
            homeExcludesStocks: html.includes("!['Indonesia equity','US equity','Hong Kong equity','Korea focus equity','Taiwan focus equity'].includes(item.group)"),
            exchangeSessionSchedule: html.includes('function exchangeSession(') && html.includes("closeTime='16:00'") && html.includes("closeTime='16:10'") && html.includes('auctionWindow=[15*60+25,15*60+30]') && html.includes('function marketPollEligible('),
            deterministicSessionLabel: html.includes('function marketSessionLabel(quote,item,now=new Date())'),
            inPlaceQuoteUpdates: html.includes('function updateQuoteRowsInPlace()') && html.includes('updateQuoteRowsInPlace();renderTape();renderMovers();'),
            liveTimestamp: html.includes('function marketFeedTimestampLabel(') && html.includes('ios-stock-updated') && html.includes('marketSessionStamp') && html.includes('setInterval(setMarketSession,4000)'),
            fiveSecondQuotePoll: html.includes('fetchQuoteSlice()},5000'),
            threeQuoteSlice: html.includes('const now=new Date(),queue=WATCHLIST.filter(item=>marketPollEligible(item,now))') && html.includes('sliceSize=6') && html.includes('APP.sliceBusy'),
            fourSecondUiTick: html.includes('updateLiveRowLabels();setMarketSession();') && html.includes('},4000)'),
            bitcoin: html.includes('function connectBitcoinStream'),
            fx: html.includes('function loadFxReference'),
            treasury: html.includes('async function loadTreasuryCurve'),
            treasury30y: html.includes("thirty:'DGS30'") && html.includes("setTenor('thirty','tsy30','tsy30Date')"),
            forexFactoryCalendar: html.includes('nfs.faireconomy.media/ff_calendar_thisweek.json') && html.includes('nfs.faireconomy.media/ff_calendar_nextweek.json'),
            investingOccurrences: html.includes('endpoints.investing.com/pd-instruments/v1/calendars/economic/events/occurrences') && html.includes('function fetchInvestingCalendar'),
            investingHtmlFallback: html.includes('function fetchInvestingCalendarHtml') && html.includes('tr.js-event-item'),
            calendarMultiSourceMerge: html.includes('mergeCalendarSources(factory,investing)') && html.includes('mergeUsCalendarActuals(merged,agency)') && html.includes('function mergeUsCalendarActuals('),
            calendarFiveMinuteCache: html.includes('const cacheTtl=5*60*1000'),
            calendarRanges: html.includes('data-cal-range="3"') && html.includes('data-cal-range="7"'),
            calendarImpact: html.includes('data-cal-impact="HIGH"') && html.includes('data-cal-impact="MEDIUM"') && html.includes('data-cal-impact="LOW"'),
            calendarMerge: html.includes('mergeCalendarSources(factory,investing)') && html.includes('mergeUsCalendarActuals(merged,agency)'),
            calendarCacheFiveMinutes: html.includes('const cacheTtl=5*60*1000'),
            calendarCountries: ['AUD','CAD','CHF','CNY','EUR','GBP','IDR','JPY','NZD','USD'].every(code => html.includes('data-cal-country="' + code + '"')),
            calendarCategories: ['Growth','Inflation','Employment','Central Bank','Bonds','Housing','Consumer Surveys','Business Surveys','Speeches','Misc'].every(name => html.includes('data-cal-category="' + name + '"')),
            previousForecastActual: html.includes("['PREVIOUS',item.previous],['FORECAST',item.forecast],['ACTUAL',item.actual]") && html.includes('Trading Economics Indonesia') && html.includes('buildIndonesiaCalendarEvents'),
            sameDayRetention: html.includes('item.dateKey>=today'),
            fiveSecondQuotePolling: html.includes('fetchQuoteSlice()},5000') && html.includes('APP.sliceBusy'),
            fourSecondDisplayTick: html.includes('updateLiveRowLabels();') && html.includes('},4000)'),
            news: html.includes('const feeds=['),
            homeList: html.includes('class="ios-stock-list" id="featuredQuotes"'),
            homeSearch: html.includes('id="homeSearchToggle"') && html.includes('id="homeSearch"'),
            homeBitcoin: html.includes('id="btcPrice"'),
            homeUsdIdr: html.includes('id="fxValue"'),
            marketSegments: html.includes('id="marketFilters"') && html.includes('data-market-filter="commodities"'),
            commodities: ["XAUUSD=X","CL=F","BZ=F","HG=F"].every(symbol => html.includes("symbol:'" + symbol + "'")),
            sparkline: html.includes('sparkline:closes.filter'),
            noBrokenChartEmbed: !html.includes('function loadChart()') && !html.includes('function loadWidgets()') && !html.includes('function mountWidget(') && !html.includes('id="mainChart"'),
            animatedControls: html.includes('.news-alert-control input[type=checkbox]:checked:before') && html.includes('@keyframes ios-page-in'),
            sourceHealthRowsValid: html.includes("['Price mini-charts','Sparkline is shown only when a provider returns historical price observations. Snapshot-only rows do not get a fabricated chart.','PROVIDER HISTORY','good'],") && html.includes("['Binance WebSocket'"),
            noWideTable: !html.includes('id="watchlistPanel"') && !html.includes('id="watchlistBody"'),
            noTwelveData: !html.includes('fetchTwelveDataQuote') && !html.includes('twelveDataKey'),
            noFmp: !html.includes('fetchFmpQuote') && !html.includes('fmpKey'),
            noPaidSettings: !html.includes('initProviderSettings') && !html.includes('marketProviderKeys'),
            sessionClosePersistence: html.includes("apis_market_closed_refresh_done") && html.includes('markClosedRefreshAttempt(item'),
            yahooProviderChangePercent: html.includes('meta.regularMarketChangePercent') && html.includes('const changePct=previousClose!==null'),
            moversIndividualEquitiesOnly: html.includes("const stockGroups=new Set(['Indonesia equity','US equity','Hong Kong equity','Korea focus equity','Taiwan focus equity'])") && html.includes("group==='Korea focus equity'") && html.includes("short:'TSMC'"),
            smoothQuoteTransitions: html.includes('@keyframes apis-quote-refresh') && html.includes('.ios-stock-item.is-updating')
          };
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const baselineStart = html.indexOf('function exchangeDateKey(');
          const baselineEnd = html.indexOf('\nasync function fetchYahooQuote', baselineStart);
          const baselineSource = baselineStart >= 0 && baselineEnd > baselineStart ? html.slice(baselineStart, baselineEnd) : '';
          const calendarStart = html.indexOf('function calendarNumericValue(');
          const calendarEnd = html.indexOf('function renderMacroCalendar()', calendarStart);
          const calendarSource = calendarStart >= 0 && calendarEnd > calendarStart ? html.slice(calendarStart, calendarEnd) : '';
          if (!baselineSource || !calendarSource) throw new Error('Regression helper extraction failed');
          const unit = { exchangeWallClock: date => ({year:date.getUTCFullYear(),month:date.getUTCMonth()+1,day:date.getUTCDate()}) };
          vm.createContext(unit);
          vm.runInContext(baselineSource + '\n' + calendarSource, unit);
          // Gate 1: session-date baseline ignores a same-day partial candle.
          const bars = [
            {price:5320.98,timestamp:Date.UTC(2026,10,16,12)/1000},
            {price:5335.61,timestamp:Date.UTC(2026,10,17,12)/1000}
          ];
          assert.equal(unit.selectDailyIndexPreviousClose(bars,'2026-11-17','Asia/Jakarta'),5320.98);
          // Gate 2: closed-session guard and previous-close requirements are wired.
          assert.ok(html.includes("session?.state==='CLOSED'&&(!useDailyClose||selectedDailyBarDay!==sessionDay)"));
          assert.ok(html.includes('Previous session close unavailable; refusing unverified daily percentage'));
          // Gate 3: actual-vs-forecast semantics (higher/lower/neutral).
          assert.equal(unit.calendarActualTone({title:'Employment Change 3M/3M',forecast:'102',actual:'156'}),'good');
          assert.equal(unit.calendarActualTone({title:'Employment Change',forecast:'156',actual:'102'}),'bad');
          assert.equal(unit.calendarActualTone({title:'Unemployment Rate',forecast:'4.7',actual:'4.6'}),'good');
          assert.equal(unit.calendarActualTone({title:'Unemployment Rate',forecast:'4.6',actual:'4.7'}),'bad');
          assert.equal(unit.calendarActualTone({title:'Average Earnings Index +Bonus',forecast:'3.8',actual:'3.6'}),'');
          assert.equal(unit.calendarActualTone({title:'BI Rate',forecast:'5.75',actual:'5.75'}),'');
          // Gate 4: Movers stay within the approved individual-stock markets and focus names.
          const moverBlock = html.includes("const stockGroups=new Set(['Indonesia equity','US equity','Hong Kong equity','Korea focus equity','Taiwan focus equity'])") ? 'Indonesia equity,US equity,Hong Kong equity,Korea focus equity,Taiwan focus equity' : '';
          for (const group of ['Indonesia equity','US equity','Hong Kong equity','Korea focus equity','Taiwan focus equity']) assert.ok(moverBlock.includes(group));
          assert.ok(html.includes("short:'SAMSUNG',group:'Korea focus equity'"));
          assert.ok(html.includes("short:'SK HYNIX',group:'Korea focus equity'"));
          assert.ok(html.includes("short:'TSMC',group:'Taiwan focus equity'"));
          assert.ok(html.includes('observed!==expected'));
          // Gate 5: mobile header and semantic colors use the same light/dark theme tokens.
          assert.ok(html.includes('.top-right .clock,.top-right .feed-state,.top-right .refresh-hint,.top-right .after-hours,.top-right .market-session-stamp{display:none!important}'));
          assert.ok(html.includes('.calendar-event-metric.actual.good strong{color:var(--green)}'));
          assert.ok(html.includes('.calendar-event-metric.actual.bad strong{color:var(--red)}'));
          assert.ok(html.includes('html[data-theme="dark"] .calendar-event-metric.actual.good'));
          console.log('Five regression gates passed: baseline, close guard, calendar scoring, mover scope, theme/header.');
          const failed = Object.entries(checks).filter(([, value]) => !value);
          console.log('Inline scripts compiled:', scripts.length);
          console.log(checks);
          if (failed.length) throw new Error('Failed checks: ' + failed.map(([key]) => key).join(', '));
          console.log('APIS static validation passed.');
          NODE
