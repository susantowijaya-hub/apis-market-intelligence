<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#080c14">
  <title>APIS — Temporarily Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #080c14; color: #e8edf5; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 620px); padding: 36px; border: 1px solid #263244; border-radius: 18px; background: #101827; }
    h1 { margin: 0 0 12px; font-size: clamp(26px, 5vw, 38px); }
    p { color: #aab7c9; }
    .status { display: inline-block; margin-bottom: 20px; padding: 5px 10px; border-radius: 999px; background: #3b2b18; color: #ffd08a; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
  </style>
</head>
<body>
  <main>
    <span class="status">TEMPORARILY SUSPENDED</span>
    <h1>APIS is offline</h1>
    <p>The APIS market-intelligence application has been temporarily shut down while development is paused.</p>
    <p>Project source code and repository history are being preserved. The service will return after development resumes.</p>
  </main>
</body>
</html>
