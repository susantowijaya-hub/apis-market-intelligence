name: APIS static validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript and free-data wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(script => script.trim());
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((script, index) => {
            try { new Function(script); }
            catch (error) { throw new Error('Inline script ' + (index + 1) + ': ' + error.message); }
          });
          const checks = {
            version: html.includes('build-version" content="2.7.0"'),
            freeMode: html.includes('Stooq public CSV snapshots') && html.includes('Yahoo Finance public chart fallback'),
            stooqAdapter: html.includes('async function fetchStooqQuote'),
            yahooFallback: html.includes('async function fetchYahooQuote'),
            publicWaterfall: html.includes('async function fetchMarketQuote'),
            xauSpotAdapter: html.includes('async function fetchXauSpotQuote') && html.includes('https://xaus.com/api/v1/spot?compact=1'),
            xauIntradayValidation: html.includes('coverage_seconds') && html.includes('historyCoverage>=23*3600'),
            twseOfficialRwd: html.includes('/rwd/zh/afterTrading/MI_INDEX?date=') && html.includes('function parseTwseIndexReport'),
            twseGregorianDate: html.includes('if(raw.length===8)'),
            twsePreviousCloseValidation: html.includes('Math.abs(implied-changePct)>0.08'),
            taiwanPercentSourceGuard: html.includes("quote.symbol==='^TWII'") && html.includes('Taiwan Stock Exchange') && html.includes('quote.providerQuoteVerified!==true'),
            regionalGroups: html.includes('function renderGroupedStockRows') && html.includes("region:'Greater China'"),
            homeExcludesStocks: html.includes("!['Indonesia equity','US equity'].includes(item.group)"),
            exchangeSessionSchedule: html.includes('function exchangeSession(') && html.includes("zone='Asia/Jakarta'") && html.includes('15*60+50'),
            liveTimestamp: html.includes('function marketFeedTimestampLabel(') && html.includes('ios-stock-updated'),
            fiveSecondQuotePoll: html.includes('fetchQuoteSlice()},5000'),
            threeQuoteSlice: html.includes('const sliceSize=3') && html.includes('APP.sliceBusy'),
            fourSecondUiTick: html.includes('updateLiveRowLabels();') && html.includes('},4000)'),
            bitcoin: html.includes('function connectBitcoinStream'),
            fx: html.includes('function loadFxReference'),
            treasury: html.includes('async function loadTreasuryCurve'),
            treasury30y: html.includes("thirty:'DGS30'") && html.includes("setTenor('thirty','tsy30','tsy30Date')"),
            forexFactoryCalendar: html.includes('nfs.faireconomy.media/ff_calendar_thisweek.json'),
            investingOccurrences: html.includes('endpoints.investing.com/pd-instruments/v1/calendars/economic/events/occurrences') && html.includes('function fetchInvestingCalendar'),
            investingHtmlFallback: html.includes('function fetchInvestingCalendarHtml') && html.includes('tr.js-event-item'),
            calendarMultiSourceMerge: html.includes('mergeCalendarSources(factory,investing)') && html.includes('mergeUsCalendarActuals(merged,agency)') && html.includes('function mergeUsCalendarActuals('),
            calendarFiveMinuteCache: html.includes('const cacheTtl=5*60*1000'),
            calendarRanges: html.includes('data-cal-range="3"') && html.includes('data-cal-range="7"'),
            calendarImpact: html.includes('data-cal-impact="HIGH"') && html.includes('data-cal-impact="MEDIUM"'),
            calendarMerge: html.includes('mergeCalendarSources(factory,investing)') && html.includes('mergeUsCalendarActuals(merged,agency)'),
            calendarCacheFiveMinutes: html.includes('const cacheTtl=5*60*1000'),
            calendarCountries: ['AUD','CAD','CHF','CNY','EUR','GBP','IDR','JPY','NZD','USD'].every(code => html.includes('data-cal-country="' + code + '"')),
            calendarCategories: ['Growth','Inflation','Employment','Central Bank','Bonds','Housing','Consumer Surveys','Business Surveys','Speeches','Misc'].every(name => html.includes('data-cal-category="' + name + '"')),
            previousForecastActual: html.includes("['PREVIOUS',item.previous],['FORECAST',item.forecast],['ACTUAL',item.actual]"),
            sameDayRetention: html.includes('item.dateKey>=today'),
            fiveSecondQuotePolling: html.includes('fetchQuoteSlice()},5000') && html.includes('APP.sliceBusy'),
            fourSecondDisplayTick: html.includes('updateLiveRowLabels();') && html.includes('},4000)'),
            news: html.includes('const feeds=['),
            homeList: html.includes('class="ios-stock-list" id="featuredQuotes"'),
            homeSearch: html.includes('id="homeSearchToggle"') && html.includes('id="homeSearch"'),
            homeBitcoin: html.includes('id="btcPrice"'),
            homeUsdIdr: html.includes('id="fxValue"'),
            marketSegments: html.includes('id="marketFilters"') && html.includes('data-market-filter="commodities"'),
            commodities: ["XAUUSD=X","CL=F","BZ=F","HG=F"].every(symbol => html.includes("symbol:'" + symbol + "'")),
            sparkline: html.includes('sparkline:closes.filter'),
            noBrokenChartEmbed: !html.includes('function loadChart()') && !html.includes('function loadWidgets()') && !html.includes('function mountWidget(') && !html.includes('id="mainChart"'),
            animatedControls: html.includes('.news-alert-control input[type=checkbox]:checked:before') && html.includes('@keyframes ios-page-in'),
            sourceHealthRowsValid: html.includes("['Price mini-charts','Sparkline is shown only when a provider returns historical price observations. Snapshot-only rows do not get a fabricated chart.','PROVIDER HISTORY','good'],") && html.includes("['Binance WebSocket'"),
            noWideTable: !html.includes('id="watchlistPanel"') && !html.includes('id="watchlistBody"'),
            noTwelveData: !html.includes('fetchTwelveDataQuote') && !html.includes('twelveDataKey'),
            noFmp: !html.includes('fetchFmpQuote') && !html.includes('fmpKey'),
            noPaidSettings: !html.includes('initProviderSettings') && !html.includes('marketProviderKeys')
          };
          const failed = Object.entries(checks).filter(([, value]) => !value);
          console.log('Inline scripts compiled:', scripts.length);
          console.log(checks);
          if (failed.length) throw new Error('Failed checks: ' + failed.map(([key]) => key).join(', '));
          console.log('APIS static validation passed.');
          NODE
